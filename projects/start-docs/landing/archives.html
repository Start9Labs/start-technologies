<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archives · Start9 Docs</title>
    <style>
      :root {
        --bg: #0f1419;
        --card-border: #2d333b;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --accent-hover: #79b8ff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4rem 1.5rem 1.5rem;
      }

      main {
        width: 100%;
        max-width: 660px;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
        margin-bottom: 2.5rem;
      }

      h2 {
        font-size: 1.2rem;
        padding-bottom: 0.4rem;
        margin: 2rem 0 0.75rem;
        border-bottom: 1px solid var(--card-border);
      }

      ul {
        list-style: none;
      }

      li {
        padding: 0.3rem 0;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        color: var(--accent-hover);
      }

      footer {
        margin-top: 4rem;
        color: var(--text-muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Archives</h1>
      <p class="subtitle">
        Documentation for older versions of Start9 products
      </p>
      <!--ARCHIVES-->
    </main>

    <footer>
      <a href="/">&#8592; All Docs</a>
    </footer>
  </body>
</html>
