[package]
edition = "2021"
license = "MIT"
name = "startwrt-dnsfwd"
version = "0.1.0"

[lib]
name = "dnsfwd"
path = "src/lib.rs"

[[bin]]
name = "startwrt-dnsfwd"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
# Must match start-core's pin, like startwrt-core's hickory-server.
hickory-net = { version = "0.26.1", features = ["tls-ring", "https-ring", "webpki-roots"] }
hickory-proto = "0.26.1"
rand = "0.9.1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
socket2 = { version = "0.6.0", features = ["all"] }
tokio = { version = "1.41.1", features = ["io-util", "macros", "net", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
