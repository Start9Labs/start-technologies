name: Sync next

# Carries every change that lands on the base branch onto the paired `next`
# iteration branch, so `next` never drifts behind what has already shipped.
# `next` is created on the first run if the repo does not have one yet.
#
# List every base branch this package maintains. Most packages have one; the
# multi-branch packages list each major line or flavor (e.g. 28.x, 29.x). A
# package whose default branch is `main` must say `main` here — a workflow
# pointed at a branch the repo does not use never runs.
#
# No paths-ignore: a docs-only commit on the base still has to reach `next`,
# or the next merge back re-introduces the stale copy.
on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  sync:
    uses: Start9Labs/start-technologies/.github/workflows/syncNext.yml@master
    permissions:
      contents: write
      pull-requests: write
