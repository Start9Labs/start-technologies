name: live-docs guard

# docs-backport.yml pushes live-docs merges onto master without code review.
on:
  # Never execute PR code in this privileged workflow.
  pull_request_target:
    branches: ['live-docs']
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-only:
    name: Docs-only
    runs-on: ubuntu-latest
    steps:
      - name: Reject changes outside the published books
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          expected=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.changed_files')
          files=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/files")

          # The files API caps responses at 3,000 files, including paginated responses.
          if ! jq -e --argjson expected "$expected" 'add | length == $expected' <<<"$files" >/dev/null; then
            echo "::error::The changed-file list is incomplete; this pull request cannot be validated."
            exit 1
          fi

          # Both rename endpoints must be published book paths.
          changed=$(jq -r '.[][] | .filename, (.previous_filename // empty)' <<<"$files" | sort -u)

          rejected=$(printf '%s\n' "$changed" \
            | grep -Ev '^projects/start-docs/|^projects/[^/]+/docs/' || true)

          # These code inputs reach packagers through the SDK's tagged guide.
          rejected="$rejected
          $(printf '%s\n' "$changed" \
            | grep -E '^projects/start-sdk/docs/(package-template|gitea-workflows)/' || true)"
          rejected=$(printf '%s\n' "$rejected" | sed 's/^ *//; /^$/d')

          if [ -n "$rejected" ]; then
            echo "::error::A live-docs pull request may only change published book files. Everything else on this branch is written by docs-sync-on-tag.yml when a product is released — send the files below to master instead."
            printf '  %s\n' $rejected
            exit 1
          fi
          echo "Docs-only: every changed file is a published book file."
