name: Release

on:
  workflow_call:
    inputs:
      TAG:
        description: 'Release tag (defaults to github.ref_name for tag-triggered runs)'
        type: string
        default: ''
      FREE_DISK_SPACE:
        description: 'Free up disk space before building'
        type: boolean
        default: false
      RELEASE_REGISTRY:
        description: "The registry to publish to. Defaults to the caller's RELEASE_REGISTRY variable."
        type: string
      S3_S9PKS_BASE_URL:
        description: "S3 base URL for package uploads (e.g. https://bucket.region.digitaloceanspaces.com). Defaults to the caller's S3_S9PKS_BASE_URL variable."
        type: string
      REGISTRY_PROXY:
        description: "Proxy URL start-cli uses to reach the registries, e.g. socks5h://proxy.example:9050 for .onion registries. The proxy must already be reachable from the runner. Defaults to the caller's REGISTRY_PROXY variable."
        type: string
      PACKAGE_READER_KEYS:
        description: "Public keys of the registry reader keys (`start-cli registry admin reader add`) that may read a private repository's package, one per line, in DER Base64 or PEM. Defaults to the caller's PACKAGE_READER_KEYS variable."
        type: string
    secrets:
      DEV_KEY:
        description: 'Developer signing key'
        required: true
      S3_ACCESS_KEY:
        description: 'S3 access key for uploading packages'
        required: false
      S3_SECRET_KEY:
        description: 'S3 secret key for uploading packages'
        required: false
      PACKAGES_TOKEN:
        description: "Forgejo token that can write the repository owner's packages; publishes a private repository's package on Forgejo without S3"
        required: false

# A `vars` input default reaches nested workflows unevaluated on Forgejo's runner.
env:
  RELEASE_REGISTRY: ${{ inputs.RELEASE_REGISTRY || vars.RELEASE_REGISTRY }}
  S3_S9PKS_BASE_URL: ${{ inputs.S3_S9PKS_BASE_URL || vars.S3_S9PKS_BASE_URL }}
  REGISTRY_PROXY: ${{ inputs.REGISTRY_PROXY || vars.REGISTRY_PROXY }}
  PACKAGE_READER_KEYS: ${{ inputs.PACKAGE_READER_KEYS || vars.PACKAGE_READER_KEYS }}

jobs:
  # Read the package's build matrix by running `make -s print-TARGETS`.
  # The convention: each package's Makefile declares `TARGETS` as the list
  # of leaf make-targets to build in parallel. The canonical s9pk.mk
  # defaults TARGETS to $(ARCHES); variant packages (immich, ollama, vllm)
  # override TARGETS to a list of variant targets.
  #
  # If the package's s9pk.mk hasn't been synced yet (no `print-%` rule),
  # `make print-TARGETS` fails and we fall back to a single-entry matrix
  # that runs plain `make` on one runner — same wall time as the legacy
  # single-job build, plus a small artifact handoff cost.
  DiscoverMatrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Validate private publication
        if: ${{ env.RELEASE_REGISTRY }}
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          ON_GITHUB: ${{ github.server_url == 'https://github.com' }}
          HAS_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
        run: |
          if [ "$PRIVATE_REPOSITORY" != true ]; then
            if [ -n "${PACKAGE_READER_KEYS//[[:space:]]/}" ]; then
              echo "::error::PACKAGE_READER_KEYS applies to private repositories only; a public repository's package is public."
              exit 1
            fi
            exit 0
          fi
          if [ -n "$S3_S9PKS_BASE_URL" ]; then
            exit 0
          fi
          if [ "$ON_GITHUB" = true ]; then
            echo "::error::A private repository on GitHub publishes through S3: set S3_S9PKS_BASE_URL."
            exit 1
          fi
          if [ "$HAS_PACKAGES_TOKEN" != true ]; then
            echo "::error::A private repository on Forgejo without S3 publishes to the owner's packages: pass a PACKAGES_TOKEN secret that can write them."
            exit 1
          fi
        shell: bash

      - name: Checkout services repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.TAG || github.ref_name }}
          submodules: recursive

      # `make print-TARGETS` parses the Makefile, whose `include
      # node_modules/@start9labs/start-sdk/s9pk.mk` (SDK 2.0+) only exists after
      # a dependency install, and whose SDK 3 version runs `start-cli` while
      # parsing. Without either, make can't parse, and discovery falls back to
      # a single-runner build that emulates every other arch.
      - name: Install package dependencies
        run: npm ci
        shell: bash

      - name: Install start-cli
        uses: Start9Labs/start-technologies/.github/actions/install-start-cli@master

      - name: Discover build matrix
        id: discover
        run: |
          if TARGETS=$(make -s print-TARGETS) && [ -n "$TARGETS" ]; then
            # Space-separated list of make-target names -> JSON array of strings.
            MATRIX=$(printf '%s\n' $TARGETS | jq -Rc 'select(length>0)' | jq -sc '.')
            echo "Discovered build matrix: $MATRIX"
          else
            echo "::warning::\`make print-TARGETS\` failed (see above); falling back to a single-entry matrix (one runner builds everything)."
            MATRIX='[""]'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
        shell: bash

  # Fan out: one runner per make-target. Each runs `make <target>`,
  # which the package's Makefile is responsible for resolving — for
  # plain packages, target is an arch name (`x86`/`arm`/`riscv`); for
  # variant packages, target is a variant name (the variant recipe
  # internally sets VARIANT and dispatches to its arches).
  BuildMatrix:
    needs: DiscoverMatrix
    # arm targets build natively on GitHub's arm64 runner — both the bare arch
    # (`arm`) and per-variant leaves (`<variant>-arm`, e.g. generic-arm). x86 and
    # riscv targets stay on x86 (riscv still emulates under QEMU). Empty target
    # (fallback path) -> x86.
    runs-on: ${{ (matrix.target == 'arm' || matrix.target == 'arm64' || matrix.target == 'aarch64' || endsWith(matrix.target, '-arm') || endsWith(matrix.target, '-arm64') || endsWith(matrix.target, '-aarch64')) && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.DiscoverMatrix.outputs.matrix) }}
    steps:
      - name: Free up disk space
        if: ${{ inputs.FREE_DISK_SPACE }}
        uses: Start9Labs/start-technologies/.github/actions/free-disk-space@master

      - name: Setup build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Checkout services repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.TAG || github.ref_name }}
          submodules: recursive

      - name: Set up developer signing key
        uses: Start9Labs/start-technologies/.github/actions/configure-developer-key@master
        with:
          key: ${{ secrets.DEV_KEY }}

      # start-cli 0.4.0-beta.10's `s9pk pack` requires a packaging workspace: a
      # `.startos/` dir holding a `build-key` signing key. A bare CI checkout has
      # none, and `s9pk init-workspace` would clone the guide repo. Provision the
      # minimum instead — reuse the developer key as the workspace build key,
      # which restores the pre-beta.10 signing identity (s9pks were signed by the
      # developer key before the build-key split).
      - name: Provision workspace build key
        run: |
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build-key
        shell: bash

      # SDK 2.0+ packages `include node_modules/@start9labs/start-sdk/s9pk.mk`,
      # so node_modules must exist before make can parse the Makefile.
      - name: Install package dependencies
        run: npm ci
        shell: bash

      - name: Build (make ${{ matrix.target || '(default)' }})
        uses: Start9Labs/start-technologies/.github/actions/build-s9pk@master
        with:
          target: ${{ matrix.target }}

      - name: Upload each s9pk as its own artifact
        uses: Start9Labs/start-technologies/.github/actions/upload-each@master
        with:
          pattern: '*.s9pk'
          archive: false
          if-no-files-found: error
          retention-days: 14

  Publish:
    needs: BuildMatrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup publish environment
        uses: Start9Labs/start-technologies/.github/actions/setup-publish-env@master

      - name: Configure registry proxy
        uses: Start9Labs/start-technologies/.github/actions/configure-registry-proxy@master
        with:
          proxy: ${{ env.REGISTRY_PROXY }}

      - name: Checkout services repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.TAG || github.ref_name }}

      - name: Set up developer signing key
        uses: Start9Labs/start-technologies/.github/actions/configure-developer-key@master
        with:
          key: ${{ secrets.DEV_KEY }}

      # BuildMatrix's s9pks are the run's only artifacts.
      - name: Collect s9pks from BuildMatrix
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: .

      - name: Verify s9pks
        run: |
          shopt -s nullglob
          files=(*.s9pk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No s9pks collected from BuildMatrix artifacts"
            exit 1
          fi
          echo "Collected ${#files[@]} s9pk(s):"
          ls -lh *.s9pk
          echo ""
          echo "SHA256SUMs:"
          sha256sum *.s9pk
        shell: bash

      - name: Extract version
        id: version
        uses: Start9Labs/start-technologies/.github/actions/extract-version@master

      # Without S3, a public s9pk too large to attach goes to Forgejo's generic package registry.
      - name: Filter s9pk files for GitHub release
        id: filter_s9pk
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          ON_GITHUB: ${{ github.server_url == 'https://github.com' }}
          HAS_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#\#}"
          echo "packages_base=${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/${{ steps.version.outputs.package_id }}/${VERSION//:/_}" >> "$GITHUB_OUTPUT"
          GH_MAX_SIZE=$((2 * 1024 * 1024 * 1024))
          OVERSIZE_FOUND=false
          RELEASE_FILES=""
          : > .package_files
          for s9pk in *.s9pk; do
            SIZE=$(stat --format=%s "$s9pk")
            if [ "$SIZE" -lt "$GH_MAX_SIZE" ]; then
              RELEASE_FILES="${RELEASE_FILES}./${s9pk}"$'\n'
              echo "$s9pk" >> .gh_release_files
              continue
            fi
            SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE")
            if [ -n "$S3_S9PKS_BASE_URL" ]; then
              echo "::warning::${s9pk} (${SIZE_HUMAN}) exceeds the 2 GiB release-asset limit and will not be attached to the release (S3 will be used as its sole download URL)"
            elif [ "$ON_GITHUB" != true ] && [ "$HAS_PACKAGES_TOKEN" = true ]; then
              echo "::notice::${s9pk} (${SIZE_HUMAN}) exceeds the 2 GiB release-asset limit and will be hosted in the owner's Forgejo packages"
              [ "$PRIVATE_REPOSITORY" = true ] || echo "$s9pk" >> .package_files
            elif [ "$ON_GITHUB" = true ]; then
              echo "::error::${s9pk} (${SIZE_HUMAN}) exceeds GitHub's 2 GiB release-asset limit and no S3 hosting is configured. Either shrink the .s9pk or set S3_S9PKS_BASE_URL to host large packages via S3."
              OVERSIZE_FOUND=true
            else
              echo "::error::${s9pk} (${SIZE_HUMAN}) exceeds the 2 GiB release-asset limit and neither S3_S9PKS_BASE_URL nor a PACKAGES_TOKEN secret is configured to host it."
              OVERSIZE_FOUND=true
            fi
          done
          if [ "$OVERSIZE_FOUND" = true ]; then
            exit 1
          fi
          {
            echo "release_files<<RELEASE_FILES_EOF"
            printf '%s' "$RELEASE_FILES"
            echo "RELEASE_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload large s9pks to Forgejo packages
        if: ${{ !github.event.repository.private && github.server_url != 'https://github.com' }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          BASE="${{ steps.filter_s9pk.outputs.packages_base }}"
          while read -r s9pk; do
            echo "Uploading ${s9pk} to Forgejo packages..."
            curl -sS -o /dev/null -X DELETE -H "Authorization: token ${PACKAGES_TOKEN}" "${BASE}/${s9pk}" || true
            curl -fsS --upload-file "$s9pk" -H "Authorization: token ${PACKAGES_TOKEN}" "${BASE}/${s9pk}"
          done < .package_files
        shell: bash

      # Links only the s9pks too large to attach: S3 copies of attached ones are
      # garbage-collected once superseded. The S3 layout mirrors start-cli s9pk publish:
      #   {S3_S9PKS_BASE_URL}/{package_id}/{version-without-#}/{filename}
      - name: Generate changelog
        run: |
          FIRST_S9PK=$(ls *.s9pk | head -1)
          RELEASE_NOTES=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.releaseNotes | if type == "object" then (.en_US // first(.[]) // "") else . end')
          S3_BASE="${S3_S9PKS_BASE_URL%/}"
          PKG_ID="${{ steps.version.outputs.package_id }}"
          PKG_VER="${{ steps.version.outputs.version }}"
          PKG_VER="${PKG_VER#\#}"
          DOWNLOADS=()
          for s9pk in *.s9pk; do
            grep -qxF "$s9pk" .gh_release_files 2>/dev/null && continue
            if grep -qxF "$s9pk" .package_files 2>/dev/null; then
              DOWNLOADS+=("- [${s9pk}](${{ steps.filter_s9pk.outputs.packages_base }}/${s9pk})")
            elif [ -n "$S3_BASE" ]; then
              DOWNLOADS+=("- [${s9pk}](${S3_BASE}/${PKG_ID}/${PKG_VER}/${s9pk})")
            fi
          done
          {
            echo "## What's Changed"
            echo ""
            echo "${RELEASE_NOTES}"
            echo ""
            if [ ${#DOWNLOADS[@]} -gt 0 ]; then
              echo "## Downloads"
              echo ""
              printf '%s\n' "${DOWNLOADS[@]}"
              echo ""
            fi
            echo "## SHA256 Hashes"
            echo '```'
            sha256sum *.s9pk
            echo '```'
          } > change-log.txt
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.TAG || github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          body_path: change-log.txt
          files: ${{ steps.filter_s9pk.outputs.release_files }}

      - name: Configure S3
        if: ${{ env.S3_S9PKS_BASE_URL }}
        run: |
          sudo apt-get install -y -qq s3cmd > /dev/null
          HOST="${S3_S9PKS_BASE_URL#https://}"
          ENDPOINT="${HOST#*.}"
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          host_base = ${ENDPOINT}
          host_bucket = %(bucket)s.${ENDPOINT}
          use_https = True
          EOF
        shell: bash

      # A private repository's s9pks are published encrypted; `.private_args` holds the flags.
      - name: Resolve private publication arguments
        if: ${{ env.RELEASE_REGISTRY }}
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          : > .private_args
          [ "$PRIVATE_REPOSITORY" = true ] || exit 0
          mapfile -t KEYS < <(printf '%s\n' "$PACKAGE_READER_KEYS" | grep -v -e '^-----' | tr -s ' \t\r' '\n' | sed '/^$/d')
          echo --private >> .private_args
          for key in "${KEYS[@]}"; do
            printf -- '--reader\n%s\n' "$key" >> .private_args
          done
          echo "Publishing ${{ steps.version.outputs.package_id }} encrypted, readable by ${#KEYS[@]} reader key(s)"
        shell: bash

      - name: Remove existing version from registry
        if: ${{ env.RELEASE_REGISTRY }}
        run: |
          REGISTRY="$RELEASE_REGISTRY"
          PACKAGE_ID="${{ steps.version.outputs.package_id }}"
          VERSION="${{ steps.version.outputs.version }}"

          if ! OUTPUT=$(start-cli --registry="${REGISTRY}" registry package get "${PACKAGE_ID}" --target-version="${VERSION}"); then
            echo "::warning::Could not query registry"
          elif [ -n "$OUTPUT" ]; then
            echo "Version ${VERSION} already exists on ${REGISTRY}. Removing..."
            start-cli --registry="${REGISTRY}" registry package remove "${PACKAGE_ID}" "${VERSION}"
          else
            echo "Version ${VERSION} not found on registry. Proceeding."
          fi
        shell: bash

      - name: Publish to Registry via S3
        if: ${{ env.RELEASE_REGISTRY && env.S3_S9PKS_BASE_URL }}
        run: |
          REGISTRY="$RELEASE_REGISTRY"
          mapfile -t PRIVATE_ARGS < .private_args
          pids=()
          for s9pk in *.s9pk; do
            echo "Publishing ${s9pk} via S3..."
            ( start-cli --registry "$REGISTRY" --s9pk-s3base "$S3_S9PKS_BASE_URL" s9pk publish "$s9pk" "${PRIVATE_ARGS[@]}" 2>&1 \
              | sed -u "s|^|[${s9pk}] |" ) &
            pids+=($!)
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=$?
          done
          exit $rc
        shell: bash

      - name: Publish to Registry via Forgejo packages
        if: ${{ env.RELEASE_REGISTRY && !env.S3_S9PKS_BASE_URL && github.event.repository.private && github.server_url != 'https://github.com' }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          REGISTRY="$RELEASE_REGISTRY"
          BASE="${{ steps.filter_s9pk.outputs.packages_base }}"
          mapfile -t PRIVATE_ARGS < .private_args
          for s9pk in *.s9pk; do
            echo "Publishing ${s9pk} encrypted via Forgejo packages..."
            curl -sS -o /dev/null -X DELETE -H "Authorization: token ${PACKAGES_TOKEN}" "${BASE}/${s9pk}" || true
            start-cli s9pk encrypt "$s9pk" - \
              | curl -fsS --upload-file - -H "Authorization: token ${PACKAGES_TOKEN}" "${BASE}/${s9pk}"
            start-cli --registry "$REGISTRY" registry package add "$s9pk" --url "${BASE}/${s9pk}" "${PRIVATE_ARGS[@]}"
          done
        shell: bash

      - name: Add GitHub release mirrors
        if: ${{ env.RELEASE_REGISTRY && env.S3_S9PKS_BASE_URL && !github.event.repository.private }}
        run: |
          REGISTRY="$RELEASE_REGISTRY"
          TAG="${{ inputs.TAG || github.ref_name }}"
          GH_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}"
          # add-mirror downloads the whole s9pk to verify every file hash, so on a large
          # package this is a multi-hundred-MB stream that GitHub's CDN sometimes drops.
          ATTEMPTS=3
          for s9pk in *.s9pk; do
            if [ -f .gh_release_files ] && grep -qxF "$s9pk" .gh_release_files; then
              echo "Adding GitHub mirror for ${s9pk}..."
              for attempt in $(seq 1 "$ATTEMPTS"); do
                if start-cli --registry "$REGISTRY" registry package add-mirror "$s9pk" "${GH_URL}/${s9pk}"; then
                  break
                fi
                if [ "$attempt" -eq "$ATTEMPTS" ]; then
                  echo "::error::add-mirror failed for ${s9pk} after ${ATTEMPTS} attempts"
                  exit 1
                fi
                backoff=$((attempt * 30))
                echo "::warning::add-mirror failed for ${s9pk} (attempt ${attempt}/${ATTEMPTS}); retrying in ${backoff}s"
                sleep "$backoff"
              done
            fi
          done
        shell: bash

      - name: Publish to Registry via GitHub
        if: ${{ env.RELEASE_REGISTRY && !env.S3_S9PKS_BASE_URL && !github.event.repository.private }}
        run: |
          REGISTRY="$RELEASE_REGISTRY"
          TAG="${{ inputs.TAG || github.ref_name }}"
          GH_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}"
          for s9pk in *.s9pk; do
            URL="${GH_URL}/${s9pk}"
            if grep -qxF "$s9pk" .package_files; then
              URL="${{ steps.filter_s9pk.outputs.packages_base }}/${s9pk}"
            fi
            echo "Publishing ${s9pk} from ${URL}..."
            start-cli --registry "$REGISTRY" registry package add "$s9pk" --url "$URL"
          done
        shell: bash
