name: Publish alpha apt suite

# One writer for the whole alpha apt suite.
#
# The three deb products share `pool-alpha/` and `dists/alpha/`, and every
# publish syncs the suite down, replaces its own package, and uploads with
# --delete-removed — so concurrent writers prune each other. Serializing
# per-product publishers on a shared concurrency group only half-solved it:
# GitHub keeps a single *pending* run per group, so a third publisher superseded
# a queued one and left that product's package stale until its next push.
#
# Collecting every product's latest master build into a single publish makes
# supersession harmless instead: whichever run survives republishes the current
# state of all three, so a dropped run costs nothing. That is also why this
# collects each product's latest build rather than the artifacts of the run that
# triggered it.
on:
  workflow_run:
    workflows: [Build Products]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # Listing and downloading artifacts from build-products.yaml runs.
  actions: read

concurrency:
  group: apt-publish-alpha
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to alpha apt
    # `workflow_run.branches` filters the *head branch* of the triggering run,
    # and a pull_request run reports the PR's head branch — so a fork PR opened
    # from a branch literally named `master` satisfies it. Requiring the
    # triggering event to be a push closes that: a push run can only originate
    # from a ref in this repository.
    #
    # One run builds every product, so its conclusion does not gate this: a
    # product whose packaging failed has no debs in that run, and the step below
    # takes that product from its last complete build instead.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Collect the latest master debs from every product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debs
          products=(start-cli start-tunnel start-registry)
          arches=(x86_64 aarch64 riscv64)
          declare -A chosen=()
          # A product's latest build is the newest completed master push run
          # holding its debs for every arch; a run that did not touch the product,
          # or failed packaging it, holds none.
          # Filter and order client-side: with branch/event/status query
          # filters, the runs API answers this job's token with months-old
          # runs instead of the newest one.
          # event == "push" is load-bearing, not a tidiness filter. A master
          # head branch alone matches a pull_request run from a fork branch of
          # that name — this job would then collect and sign attacker-built
          # .debs into alpha. It also excludes workflow_dispatch builds, which
          # may be dev-flavoured or partial-arch.
          # The listing is newest first, and debs expire after 14 days: a page
          # with no newer run ends the search.
          cutoff=$(jq -nr 'now - 15 * 86400 | todate')
          page=1
          while :; do
            response=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-products.yaml/runs?per_page=100&page=$page")
            jq -e --arg cutoff "$cutoff" 'any(.workflow_runs[]; .created_at >= $cutoff)' \
              <<< "$response" > /dev/null || break
            runs=$(jq -r '[.workflow_runs[]
              | select(.event == "push" and .head_branch == "master"
                  and .status == "completed"
                  and .head_repository.full_name == env.GITHUB_REPOSITORY)]
              | sort_by(.created_at) | reverse | .[].id' <<< "$response")
            for run_id in $runs; do
              names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired | not) | .name')
              for product in "${products[@]}"; do
                [ -z "${chosen[$product]:-}" ] || continue
                complete=1
                for arch in "${arches[@]}"; do
                  grep -qx "${product}_${arch}.deb" <<< "$names" || complete=0
                done
                [ "$complete" = 0 ] || chosen[$product]=$run_id
              done
              [ "${#chosen[@]}" -lt "${#products[@]}" ] || break 2
            done
            page=$((page + 1))
          done
          collected=0
          for product in "${products[@]}"; do
            run_id=${chosen[$product]:-}
            if [ -z "$run_id" ]; then
              echo "::warning::$product has no complete master build left; the suite keeps whatever version it already holds."
              continue
            fi
            gh run download -R "$GITHUB_REPOSITORY" "$run_id" -p "${product}_*.deb" -D debs
            echo "$product: collected from run $run_id ($(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha))"
            collected=1
          done
          if [ "$collected" != 1 ]; then
            echo "::error::No .deb artifacts could be collected from any product."
            exit 1
          fi
          echo "Publishing:"
          find debs -type f -name '*.deb' | sort | sed 's/^/  /'

      - uses: ./.github/actions/publish-apt
        with:
          suite: alpha
          path: debs
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          gpg-key-id: ${{ secrets.APT_GPG_KEY_ID }}
