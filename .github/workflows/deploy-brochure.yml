name: Deploy brochure (marketplace.start9.com)

# Builds projects/brochure-marketplace and publishes it to the NextExplorer
# folder Start9 Pages serves as marketplace.start9.com. Triggers only when
# brochure's build inputs change.

on:
  push:
    branches: ['master']
    paths:
      - 'projects/brochure-marketplace/**'
      - 'shared-libs/ts-modules/shared/**'
      - 'shared-libs/ts-modules/marketplace/**'
      - 'shared-libs/ts-modules/start-core/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.lib.json'
      - 'shared-libs/crates/patch-db'
      - '.github/workflows/deploy-brochure.yml'
      - '.github/actions/nextexplorer-publish/**'
      # Doc-only edits under the allowlisted paths (e.g. start-core/**) shouldn't redeploy.
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy-brochure'
  cancel-in-progress: false

env:
  NODEJS_VERSION: '24.17.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # web resolves start-core via file:shared-libs/ts-modules/start-core/dist, so it must exist
      # before web's `npm ci` and the brochure build.
      - name: Build start-core
        run: |
          npm --prefix shared-libs/ts-modules/start-core ci
          cd shared-libs/ts-modules/start-core && make dist

      # brochure transitively bundles patch-db-client (file:../shared-libs/crates/patch-db/client),
      # so its dist must be built too.
      - name: Build patch-db client
        run: |
          npm --prefix shared-libs/crates/patch-db/client ci
          npm --prefix shared-libs/crates/patch-db/client run build

      - name: Install web dependencies
        run: npm ci

      - name: Build brochure
        run: |
          npm run build:brochure
          test -f projects/brochure-marketplace/dist/raw/brochure-marketplace/404.html

      - name: Publish to NextExplorer
        uses: ./.github/actions/nextexplorer-publish
        with:
          url: https://${{ vars.NEXT_EXPLORER_EVELYN_URL }}
          email: ${{ vars.NEXT_EXPLORER_EVELYN_USER }}
          password: ${{ secrets.NEXT_EXPLORER_EVELYN_PASS }}
          dir: projects/brochure-marketplace/dist/raw/brochure-marketplace
          folder: marketplace.start9.com
