name: Issue triage

on:
  issues:
    types: [opened, edited, labeled, unlabeled, typed, untyped]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Keys mirror the Project dropdown in .github/ISSUE_TEMPLATE/9-feature-request.yml
            // and 10-task.yml, and the static `labels:` on each bug form.
            const OWNERS = {
              StartOS: 'dr-bonez',
              'start-cli': 'dr-bonez',
              StartSDK: 'dr-bonez',
              'start-registry': 'dr-bonez',
              StartTunnel: 'dr-bonez',
              StartWRT: 'dominion5254',
              brochure: 'MattDHill',
              'start-docs': 'MattDHill',
              repo: 'dr-bonez',
            }
            const FEATURE_OWNER = 'MattDHill'
            const DEFAULT_OWNER = 'dr-bonez'
            const TYPES = ['Bug', 'Feature', 'Task']
            const GATE = 'needs-triage'
            const MARKER = '<!-- issue-triage: needs-triage -->'

            const issue = context.payload.issue
            const api = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number }
            const labels = new Set(issue.labels.map((l) => l.name))

            const picked = (issue.body || '')
              .split(/^###[ \t]+/m)
              .find((s) => s.split('\n')[0].trim() === 'Project')
              ?.split('\n')
              .slice(1)
              .map((line) => line.trim())
              .find((line) => line.length > 0)

            if (picked && picked in OWNERS && !labels.has(picked)) {
              await github.rest.issues.addLabels({ ...api, labels: [picked] })
              labels.add(picked)
              core.info(`Labelled ${picked}`)
            }

            const project = [...labels].find((l) => l in OWNERS)
            const type = issue.type?.name
            const assignees = issue.assignees.map((a) => a.login)

            if (!type || !project) {
              const missing = [!type && 'an issue type', !project && 'a project label'].filter(Boolean).join(' and ')
              if (!labels.has(GATE)) {
                await github.rest.issues.addLabels({ ...api, labels: [GATE] })
              }
              const comments = await github.paginate(github.rest.issues.listComments, { ...api, per_page: 100 })
              if (!comments.some((c) => c.body?.includes(MARKER))) {
                const fix = [
                  `gh issue edit ${issue.number} --repo ${api.owner}/${api.repo}`,
                  !type && `--type <${TYPES.join('|')}>`,
                  !project && `--add-label <${Object.keys(OWNERS).join('|')}>`,
                ]
                  .filter(Boolean)
                  .join(' ')
                await github.rest.issues.createComment({
                  ...api,
                  body: [
                    MARKER,
                    `This issue is missing ${missing}, so it is outside every triage view and cannot be routed to its owner. Set it and \`${GATE}\` lifts itself:`,
                    '',
                    '```',
                    fix,
                    '```',
                    '',
                    'Filing rules, including the body layout: [`AGENTS.md` § Filing issues](https://github.com/' +
                      `${api.owner}/${api.repo}/blob/master/AGENTS.md#filing-issues).`,
                  ].join('\n'),
                })
              }
              if (!assignees.length) {
                await github.rest.issues.addAssignees({ ...api, assignees: [DEFAULT_OWNER] })
                core.info(`Missing ${missing}; assigned fallback ${DEFAULT_OWNER}`)
              }
              return
            }

            const owner = type === 'Feature' ? FEATURE_OWNER : OWNERS[project]
            if (labels.has(GATE)) {
              await github.rest.issues.removeLabel({ ...api, name: GATE })
              if (assignees.length === 1 && assignees[0] === DEFAULT_OWNER && owner !== DEFAULT_OWNER) {
                await github.rest.issues.removeAssignees({ ...api, assignees: [DEFAULT_OWNER] })
                assignees.length = 0
              }
            }
            if (assignees.length) return

            await github.rest.issues.addAssignees({ ...api, assignees: [owner] })
            core.info(`Assigned ${owner}`)
