name: Build and deploy docs

# docs.start9.com serves the `live-docs` branch, not master. master carries the
# docs for whatever is *next*; a book only goes live when its product is tagged
# and docs-sync-on-tag.yml copies that tag's tree onto live-docs — its push is
# what triggers this. Urgent fixes to what is already published go straight into
# live-docs by PR, and docs-backport.yml then lands the same change on master.
on:
  push:
    branches: ['live-docs']
    paths:
      - 'projects/start-docs/**'
      - 'projects/start-os/docs/**'
      - 'projects/start-tunnel/docs/**'
      - 'projects/start-sdk/docs/**'
      - 'projects/start-wrt/docs/**'
  # For redeploying the current live-docs without a new commit. The Run workflow
  # UI defaults its ref to master, so the checkout below pins `live-docs`
  # explicitly — otherwise a default dispatch would publish master's unreleased
  # books and versions.conf to docs.start9.com.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/start-docs
    steps:
      # Pinned, not inherited from the triggering ref: this workflow publishes
      # docs.start9.com, and live-docs is the only branch that may reach it.
      - uses: actions/checkout@v4
        with:
          ref: live-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mdBook
        run: |
          MDBOOK_VERSION='v0.5.2'
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/mdbook

      - name: Install mdbook-tabs
        run: |
          cargo install mdbook-tabs --version 0.3.4
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build the site
        run: ./build.sh

      # 0.3.5.x is the retired Sphinx site, seeded by hand and built by nothing.
      - name: Publish to NextExplorer
        uses: ./.github/actions/nextexplorer-publish
        with:
          url: https://${{ vars.NEXT_EXPLORER_EVELYN_URL }}
          email: ${{ vars.NEXT_EXPLORER_EVELYN_USER }}
          password: ${{ secrets.NEXT_EXPLORER_EVELYN_PASS }}
          dir: projects/start-docs/docs
          folder: docs.start9.com
          keep: 0.3.5.x
