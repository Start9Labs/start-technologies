name: start-registry

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        options:
          - NONE
          - dev
          - unstable
          - dev-unstable
      runner:
        type: choice
        description: Runner
        options:
          - standard
          - fast
      arch:
        type: choice
        description: Architecture
        options:
          - ALL
          - x86_64
          - aarch64
          - riscv64
  # `paths:` below mirror projects/start-registry/build.mk's build inputs — keep
  # both in sync (see root AGENTS.md "Coupled changes").
  push:
    branches:
      - master
      - integration/*
    paths:
      - 'projects/start-registry/**'
      - 'shared-libs/crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build/**'
      - 'debian/**'
      - '.github/workflows/start-registry.yaml'
      - '.github/actions/setup-build/**'
      # Doc-only edits shouldn't trigger a build. (start-registry has no docs/
      # subtree today, but this guards a README or future docs under the allowlist.)
      - '!**/*.md'
  pull_request:
    branches:
      - master
      - integration/*
    paths:
      - 'projects/start-registry/**'
      - 'shared-libs/crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build/**'
      - 'debian/**'
      - '.github/workflows/start-registry.yaml'
      - '.github/actions/setup-build/**'
      # Doc-only edits shouldn't trigger a build. (start-registry has no docs/
      # subtree today, but this guards a README or future docs under the allowlist.)
      - '!**/*.md'

# The group is scoped by event so a master push can't cancel an in-flight
# dispatched release build. Only pull requests cancel: a push to master
# publishes to alpha, so master pushes queue behind each other rather than
# aborting a publish half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODEJS_VERSION: '24.11.0'
  # Empty (release-equivalent) on master, `dev` everywhere else a build happens
  # without an explicit input — PRs and integration/* branches. Continuous
  # deployment must not ship dev-flavoured artifacts.
  ENVIRONMENT: >-
    ${{
      fromJson(format('["{0}", ""]', github.event.inputs.environment || 'dev'))[
        github.event.inputs.environment == 'NONE'
        || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      ]
    }}

jobs:
  compile:
    name: Build Debian Package
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: true
      matrix:
        arch: >-
          ${{
            fromJson('{
              "x86_64": ["x86_64"],
              "aarch64": ["aarch64"],
              "riscv64": ["riscv64"],
              "ALL": ["x86_64", "aarch64", "riscv64"]
            }')[github.event.inputs.platform || 'ALL']
          }}
    runs-on: ${{ fromJson('["ubuntu-latest", "ubuntu-24.04-32-cores"]')[github.event.inputs.runner == 'fast'] }}
    steps:
      - name: Mount tmpfs
        if: ${{ github.event.inputs.runner == 'fast' }}
        run: sudo mount -t tmpfs tmpfs .
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          nodejs-version: ${{ env.NODEJS_VERSION }}

      - name: Make
        run: make start-registry-deb
        env:
          PLATFORM: ${{ matrix.arch }}
          SCCACHE_GHA_ENABLED: on
          SCCACHE_GHA_VERSION: 0

      - uses: actions/upload-artifact@v7
        with:
          name: start-registry_${{ matrix.arch }}.deb
          path: results/start-registry-*_${{ matrix.arch }}.deb
          retention-days: 14

  create-image:
    name: Create Docker Image
    needs: [compile]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ fromJson('["ubuntu-latest", "ubuntu-24.04-32-cores"]')[github.event.inputs.runner == 'fast'] }}
    steps:
      - name: Cleaning up unnecessary files
        run: |
          sudo apt-get remove --purge -y google-chrome-stable firefox mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean

      - run: |
          sudo mount -t tmpfs tmpfs .
        if: ${{ github.event.inputs.runner == 'fast' }}

      - name: Set up docker QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/Start9Labs/startos-registry
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Download debian package
        uses: actions/download-artifact@v8
        with:
          pattern: start-registry_*.deb

      - name: Map matrix.arch to docker platform
        run: |
          platforms=""
          for deb in *.deb; do
            filename=$(basename "$deb" .deb)
            arch="${filename#*_}"
            case "$arch" in
              x86_64)
                platform="linux/amd64"
                ;;
              aarch64)
                platform="linux/arm64"
                ;;
              riscv64)
                platform="linux/riscv64"
                ;;
              *)
                echo "Unknown architecture: $arch" >&2
                exit 1
                ;;
            esac
            if [ -z "$platforms" ]; then
              platforms="$platform"
            else
              platforms="$platforms,$platform"
            fi
          done
          echo "DOCKER_PLATFORM=$platforms" >> "$GITHUB_ENV"

      - run: |
          cat | docker buildx build --platform "$DOCKER_PLATFORM" --push -t ${{ steps.meta.outputs.tags }} -f - . << 'EOF'
          FROM debian:trixie

          ADD *.deb .

          RUN apt-get update && apt-get install -y ./*_$(uname -m).deb && rm -rf *.deb /var/lib/apt/lists/*

          VOLUME /var/lib/startos

          ENV RUST_LOG=warn,start_core=debug

          ENTRYPOINT ["start-registryd"]

          EOF

  # master is only ever merged to once a change is tested and shippable, so every
  # push publishes into the `alpha` apt suite for testers. The `stable` suite is
  # untouched — each suite owns its own pool (debian/publish.sh) — and real
  # releases still go out only through scripts/manage-release.sh.
  publish-alpha:
    name: Publish to alpha apt
    needs: [compile]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    # All three deb products publish into the same pool-alpha/ + dists/alpha/.
    # Each one syncs that suite down, adds only its own debs, and uploads with
    # --delete-removed — so two running at once would each prune the other's
    # just-published package. The group name is deliberately fixed and shared
    # across the three workflows; never scope it by github.workflow.
    #
    # Known limitation: GitHub keeps only one *pending* run per group, so if all
    # three publish at once the middle one is superseded rather than queued, and
    # that product's alpha deb stays at its previous version until its next push
    # to master. That costs freshness on a testing channel, never correctness —
    # the suite is always internally consistent, because the superseded run
    # never wrote.
    concurrency:
      group: apt-publish-alpha
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Download deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*.deb'
          path: debs/
          merge-multiple: true

      - uses: ./.github/actions/publish-apt
        with:
          suite: alpha
          path: debs
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          gpg-key-id: ${{ secrets.APT_GPG_KEY_ID }}
