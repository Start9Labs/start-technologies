name: start-tunnel

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        options:
          - NONE
          - dev
          - unstable
          - dev-unstable
      runner:
        type: choice
        description: Runner
        options:
          - standard
          - fast
      arch:
        type: choice
        description: Architecture
        options:
          - ALL
          - x86_64
          - aarch64
          - riscv64
  # `paths:` below mirror projects/start-tunnel/build.mk's build inputs — keep
  # both in sync (see root AGENTS.md "Coupled changes").
  push:
    branches:
      - master
      - integration/*
    paths:
      - 'projects/start-tunnel/**'
      - 'shared-libs/crates/**'
      - 'shared-libs/ts-modules/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.lib.json'
      - 'build/**'
      - 'debian/**'
      - 'apt/**'
      - '.github/workflows/start-tunnel.yaml'
      - '.github/actions/setup-build/**'
      # Doc-only edits under the allowlisted project trees (e.g.
      # projects/start-tunnel/docs/**) shouldn't trigger a build.
      - '!**/*.md'
  pull_request:
    branches:
      - master
      - integration/*
    paths:
      - 'projects/start-tunnel/**'
      - 'shared-libs/crates/**'
      - 'shared-libs/ts-modules/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.lib.json'
      - 'build/**'
      - 'debian/**'
      - 'apt/**'
      - '.github/workflows/start-tunnel.yaml'
      - '.github/actions/setup-build/**'
      # Doc-only edits under the allowlisted project trees (e.g.
      # projects/start-tunnel/docs/**) shouldn't trigger a build.
      - '!**/*.md'

# The group is scoped by event so a master push can't cancel an in-flight
# dispatched release build. Only pull requests cancel: a push to master
# publishes to alpha, so master pushes queue behind each other rather than
# aborting a publish half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODEJS_VERSION: '24.17.0'
  ENVIRONMENT: '${{ fromJson(format(''["{0}", ""]'', github.event.inputs.environment || ''dev''))[github.event.inputs.environment == ''NONE''] }}'

jobs:
  compile:
    name: Build Debian Package
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: true
      matrix:
        arch: >-
          ${{
            fromJson('{
              "x86_64": ["x86_64"],
              "aarch64": ["aarch64"],
              "riscv64": ["riscv64"],
              "ALL": ["x86_64", "aarch64", "riscv64"]
            }')[github.event.inputs.platform || 'ALL']
          }}
    runs-on: ${{ fromJson('["ubuntu-latest", "ubuntu-24.04-32-cores"]')[github.event.inputs.runner == 'fast'] }}
    steps:
      - name: Mount tmpfs
        if: ${{ github.event.inputs.runner == 'fast' }}
        run: sudo mount -t tmpfs tmpfs .
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          nodejs-version: ${{ env.NODEJS_VERSION }}

      - name: Make
        run: make start-tunnel-deb
        env:
          PLATFORM: ${{ matrix.arch }}
          SCCACHE_GHA_ENABLED: on
          SCCACHE_GHA_VERSION: 0

      - uses: actions/upload-artifact@v7
        with:
          name: start-tunnel_${{ matrix.arch }}.deb
          path: results/start-tunnel-*_${{ matrix.arch }}.deb
          retention-days: 14

  # master is only ever merged to once a change is tested and shippable, so every
  # push publishes into the `alpha` apt suite for testers. The `stable` suite is
  # untouched — each suite owns its own pool (debian/publish.sh) — and real
  # releases still go out only through scripts/manage-release.sh.
  publish-alpha:
    name: Publish to alpha apt
    needs: [compile]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    # All three deb products publish into the same pool-alpha/ + dists/alpha/.
    # Each one syncs that suite down, adds only its own debs, and uploads with
    # --delete-removed — so two running at once would each prune the other's
    # just-published package. The group name is deliberately fixed and shared
    # across the three workflows; never scope it by github.workflow.
    concurrency:
      group: apt-publish-alpha
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Download deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*.deb'
          path: debs/
          merge-multiple: true

      - uses: ./.github/actions/publish-apt
        with:
          suite: alpha
          path: debs
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          gpg-key-id: ${{ secrets.APT_GPG_KEY_ID }}
