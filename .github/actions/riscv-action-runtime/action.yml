name: RISC-V action runtime
description: >-
  Replaces the runner's bundled action Node with the requested release, run
  `--single-threaded`. V8's background threads corrupt the heap on the riscv64
  runners during large artifact transfers. Leaves the runtime untouched when the
  download or probe fails.
inputs:
  nodejs-version:
    description: Node release to install
    required: true
runs:
  using: composite
  steps:
    # Actions use the runner's bundled Node, not the Node on GITHUB_PATH.
    # Its wrapper is bash; dash drops hyphenated `INPUT_*` variables.
    - shell: bash
      env:
        NODEJS_VERSION: ${{ inputs.nodejs-version }}
      run: |
        set -euo pipefail
        worker="$(readlink -f "/proc/$PPID/exe")"
        test "$(basename "$worker")" = Runner.Worker
        runner_node="$(dirname "$worker")/../externals/node24/bin/node"
        echo "Bundled action runtime: $("$runner_node" --version)"
        base="https://unofficial-builds.nodejs.org/download/release/v${NODEJS_VERSION}"
        tarball="node-v${NODEJS_VERSION}-linux-riscv64.tar.xz"
        cd "$RUNNER_TEMP"
        curl -fsSLO "$base/$tarball"
        curl -fsSL "$base/SHASUMS256.txt" | grep " $tarball\$" | sha256sum -c -
        tar -xJf "$tarball"
        node_dir="$RUNNER_TEMP/${tarball%.tar.xz}"
        test "$("$node_dir/bin/node" --version)" = "v${NODEJS_VERSION}"
        "$node_dir/bin/node" --single-threaded -e 'require("node:crypto").createHash("sha256").update("action-runtime").digest(); console.log(process.versions)'
        install -m 755 "$node_dir/bin/node" "$runner_node.real.next"
        mv -f "$runner_node.real.next" "$runner_node.real"
        printf '#!/bin/bash\nexec "%s" --single-threaded "$@"\n' "$runner_node.real" > "$runner_node.next"
        chmod 755 "$runner_node.next"
        mv -f "$runner_node.next" "$runner_node"
        echo "Updated action runtime: $("$runner_node" --version)"
        echo "$node_dir/bin" >> "$GITHUB_PATH"
