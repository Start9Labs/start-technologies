# Generated by scripts/generate-forgejo-workflows.cjs; edit the GitHub sources instead.
name: Build
'on':
  workflow_call:
    inputs:
      FREE_DISK_SPACE:
        description: Free up disk space before building
        type: boolean
        default: false
    secrets:
      DEV_KEY:
        description: Developer signing key
        required: false
jobs:
  DiscoverMatrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout services repository
        uses: https://github.com/actions/checkout@v6
        with:
          submodules: recursive
      - name: Install package dependencies
        run: npm ci
        shell: bash
      - name: Install start-cli
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/install-start-cli@master
      - name: Discover build matrix
        id: discover
        run: |
          if TARGETS=$(make -s print-TARGETS) && [ -n "$TARGETS" ]; then
            # Space-separated list of make-target names -> JSON array of strings.
            MATRIX=$(printf '%s\n' $TARGETS | jq -Rc 'select(length>0)' | jq -sc '.')
            echo "Discovered build matrix: $MATRIX"
          else
            echo "::warning::\`make print-TARGETS\` failed (see above); falling back to a single-entry matrix (one runner builds everything)."
            MATRIX='[""]'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
        shell: bash
  BuildMatrix:
    needs: DiscoverMatrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.DiscoverMatrix.outputs.matrix) }}
    steps:
      - name: Free up disk space
        if: ${{ inputs.FREE_DISK_SPACE }}
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/free-disk-space@master
      - name: Setup build environment
        uses: https://github.com/Start9Labs/start-technologies/.forgejo/actions/setup-build-env@master
      - name: Checkout services repository
        uses: https://github.com/actions/checkout@v6
        with:
          submodules: recursive
      - name: Find or create identity signing key
        run: |
          if [ -n "${{ secrets.DEV_KEY }}" ]; then
            mkdir -p ~/.startos
            printf '%s' "${{ secrets.DEV_KEY }}" > ~/.startos/id.key.pem
          else
            start-cli init-key
          fi
        shell: bash
      - name: Provision workspace build key
        run: |
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem
        shell: bash
      - name: Install package dependencies
        run: npm ci
        shell: bash
      - name: Build (make ${{ matrix.target || '(default)' }})
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/build-s9pk@master
        with:
          target: ${{ matrix.target }}
      - name: Upload s9pks
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          retention-days: 14
          compression-level: 0
          name: s9pks-${{ matrix.target || 'default' }}
          path: '*.s9pk'
