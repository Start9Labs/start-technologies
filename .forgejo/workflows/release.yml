# Generated by scripts/generate-forgejo-workflows.cjs; edit the GitHub sources instead.
name: Release
'on':
  workflow_call:
    inputs:
      TAG:
        description: Release tag (defaults to github.ref_name for tag-triggered runs)
        type: string
        default: ''
      FREE_DISK_SPACE:
        description: Free up disk space before building
        type: boolean
        default: false
      RELEASE_REGISTRY:
        description: The registry to publish to
        type: string
      S3_S9PKS_BASE_URL:
        description: S3 base URL for package uploads (e.g. https://bucket.region.digitaloceanspaces.com)
        type: string
    secrets:
      DEV_KEY:
        description: Developer signing key
        required: true
      S3_ACCESS_KEY:
        description: S3 access key for uploading packages
        required: false
      S3_SECRET_KEY:
        description: S3 secret key for uploading packages
        required: false
jobs:
  DiscoverMatrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout services repository
        uses: https://github.com/actions/checkout@v6
        with:
          ref: ${{ inputs.TAG || github.ref_name }}
          submodules: recursive
      - name: Install package dependencies
        run: npm ci
        shell: bash
      - name: Install start-cli
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/install-start-cli@master
      - name: Discover build matrix
        id: discover
        run: |
          if TARGETS=$(make -s print-TARGETS) && [ -n "$TARGETS" ]; then
            # Space-separated list of make-target names -> JSON array of strings.
            MATRIX=$(printf '%s\n' $TARGETS | jq -Rc 'select(length>0)' | jq -sc '.')
            echo "Discovered build matrix: $MATRIX"
          else
            echo "::warning::\`make print-TARGETS\` failed (see above); falling back to a single-entry matrix (one runner builds everything)."
            MATRIX='[""]'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
        shell: bash
  BuildMatrix:
    needs: DiscoverMatrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.DiscoverMatrix.outputs.matrix) }}
    steps:
      - name: Free up disk space
        if: ${{ inputs.FREE_DISK_SPACE }}
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/free-disk-space@master
      - name: Setup build environment
        uses: https://github.com/Start9Labs/start-technologies/.forgejo/actions/setup-build-env@master
      - name: Checkout services repository
        uses: https://github.com/actions/checkout@v6
        with:
          ref: ${{ inputs.TAG || github.ref_name }}
          submodules: recursive
      - name: Set up developer signing key
        run: |
          mkdir -p ~/.startos
          printf '%s' "${{ secrets.DEV_KEY }}" > ~/.startos/developer.key.pem
        shell: bash
      - name: Provision workspace build key
        run: |
          mkdir -p .startos
          cp ~/.startos/developer.key.pem .startos/build-key
        shell: bash
      - name: Install package dependencies
        run: npm ci
        shell: bash
      - name: Build (make ${{ matrix.target || '(default)' }})
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/build-s9pk@master
        with:
          target: ${{ matrix.target }}
      - name: Upload s9pks for Publish stage
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-${{ matrix.target || 'default' }}
          path: ./*.s9pk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  Publish:
    needs: BuildMatrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup publish environment
        uses: https://github.com/Start9Labs/start-technologies/.forgejo/actions/setup-publish-env@master
      - name: Checkout services repository
        uses: https://github.com/actions/checkout@v6
        with:
          ref: ${{ inputs.TAG || github.ref_name }}
      - name: Set up developer signing key
        run: |
          mkdir -p ~/.startos
          printf '%s' "${{ secrets.DEV_KEY }}" > ~/.startos/developer.key.pem
        shell: bash
      - name: Collect s9pks from BuildMatrix
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: .
      - name: Verify s9pks
        run: |
          shopt -s nullglob
          files=(*.s9pk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No s9pks collected from BuildMatrix artifacts"
            exit 1
          fi
          echo "Collected ${#files[@]} s9pk(s):"
          ls -lh *.s9pk
          echo ""
          echo "SHA256SUMs:"
          sha256sum *.s9pk
        shell: bash
      - name: Extract version
        id: version
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/extract-version@master
      - name: Filter s9pk files for GitHub release
        id: filter_s9pk
        run: |
          GH_MAX_SIZE=$((2 * 1024 * 1024 * 1024))
          OVERSIZE_FOUND=false
          RELEASE_FILES=""
          for s9pk in *.s9pk; do
            SIZE=$(stat --format=%s "$s9pk")
            if [ "$SIZE" -ge "$GH_MAX_SIZE" ]; then
              SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE")
              if [ -z "${{ inputs.S3_S9PKS_BASE_URL }}" ]; then
                echo "::error::${s9pk} (${SIZE_HUMAN}) exceeds GitHub's 2 GiB release-asset limit and no S3 hosting is configured. Either shrink the .s9pk or set S3_S9PKS_BASE_URL to host large packages via S3."
                OVERSIZE_FOUND=true
              else
                echo "::warning::${s9pk} (${SIZE_HUMAN}) exceeds GitHub's 2 GiB limit and will not be uploaded to the release (S3 will be used as its sole download URL)"
              fi
            else
              RELEASE_FILES="${RELEASE_FILES}./${s9pk}"$'\n'
              echo "$s9pk" >> .gh_release_files
            fi
          done
          if [ "$OVERSIZE_FOUND" = true ]; then
            exit 1
          fi
          {
            echo "release_files<<RELEASE_FILES_EOF"
            printf '%s' "$RELEASE_FILES"
            echo "RELEASE_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Generate changelog
        run: |
          FIRST_S9PK=$(ls *.s9pk | head -1)
          RELEASE_NOTES=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.releaseNotes | if type == "object" then (.en_US // first(.[]) // "") else . end')
          {
            echo "## What's Changed"
            echo ""
            echo "${RELEASE_NOTES}"
            echo ""
            S3_BASE="${{ inputs.S3_S9PKS_BASE_URL }}"
            if [ -n "$S3_BASE" ]; then
              S3_BASE="${S3_BASE%/}"
              PKG_ID="${{ steps.version.outputs.package_id }}"
              PKG_VER="${{ steps.version.outputs.version }}"
              PKG_VER="${PKG_VER#\#}"
              echo "## Downloads"
              echo ""
              for s9pk in *.s9pk; do
                echo "- [${s9pk}](${S3_BASE}/${PKG_ID}/${PKG_VER}/${s9pk})"
              done
              echo ""
            fi
            echo "## SHA256 Hashes"
            echo '```'
            sha256sum *.s9pk
            echo '```'
          } > change-log.txt
        shell: bash
      - name: Create Forgejo release
        uses: https://github.com/Start9Labs/start-technologies/.github/actions/forgejo-release@master
        with:
          tag_name: ${{ inputs.TAG || github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          body_path: change-log.txt
          files: ${{ steps.filter_s9pk.outputs.release_files }}
          token: ${{ github.token }}
      - name: Configure S3
        if: ${{ inputs.S3_S9PKS_BASE_URL }}
        run: |
          sudo apt-get install -y -qq s3cmd > /dev/null
          S3_S9PKS_BASE_URL="${{ inputs.S3_S9PKS_BASE_URL }}"
          HOST="${S3_S9PKS_BASE_URL#https://}"
          ENDPOINT="${HOST#*.}"
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          host_base = ${ENDPOINT}
          host_bucket = %(bucket)s.${ENDPOINT}
          use_https = True
          EOF
        shell: bash
      - name: Remove existing version from registry
        if: ${{ inputs.RELEASE_REGISTRY }}
        run: |
          REGISTRY="${{ inputs.RELEASE_REGISTRY }}"
          PACKAGE_ID="${{ steps.version.outputs.package_id }}"
          VERSION="${{ steps.version.outputs.version }}"

          if ! OUTPUT=$(start-cli --registry="${REGISTRY}" registry package get "${PACKAGE_ID}" --target-version="${VERSION}" 2>&1); then
            echo "::warning::Could not query registry: ${OUTPUT}"
          elif [ -n "$OUTPUT" ]; then
            echo "Version ${VERSION} already exists on ${REGISTRY}. Removing..."
            start-cli --registry="${REGISTRY}" registry package remove "${PACKAGE_ID}" "${VERSION}"
          else
            echo "Version ${VERSION} not found on registry. Proceeding."
          fi
        shell: bash
      - name: Publish to Registry via S3
        if: ${{ inputs.RELEASE_REGISTRY && inputs.S3_S9PKS_BASE_URL }}
        run: |
          REGISTRY="${{ inputs.RELEASE_REGISTRY }}"
          S3_BASE="${{ inputs.S3_S9PKS_BASE_URL }}"
          pids=()
          for s9pk in *.s9pk; do
            echo "Publishing ${s9pk} via S3..."
            ( start-cli --registry "$REGISTRY" --s9pk-s3base "$S3_BASE" s9pk publish "$s9pk" 2>&1 \
              | sed -u "s|^|[${s9pk}] |" ) &
            pids+=($!)
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=$?
          done
          exit $rc
        shell: bash
      - name: Add GitHub release mirrors
        if: ${{ inputs.RELEASE_REGISTRY && inputs.S3_S9PKS_BASE_URL }}
        run: |
          REGISTRY="${{ inputs.RELEASE_REGISTRY }}"
          TAG="${{ inputs.TAG || github.ref_name }}"
          GH_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}"
          # add-mirror downloads the whole s9pk to verify every file hash, so on a large
          # package this is a multi-hundred-MB stream that GitHub's CDN sometimes drops.
          ATTEMPTS=3
          for s9pk in *.s9pk; do
            if [ -f .gh_release_files ] && grep -qxF "$s9pk" .gh_release_files; then
              echo "Adding GitHub mirror for ${s9pk}..."
              for attempt in $(seq 1 "$ATTEMPTS"); do
                if start-cli --registry "$REGISTRY" registry package add-mirror "$s9pk" "${GH_URL}/${s9pk}"; then
                  break
                fi
                if [ "$attempt" -eq "$ATTEMPTS" ]; then
                  echo "::error::add-mirror failed for ${s9pk} after ${ATTEMPTS} attempts"
                  exit 1
                fi
                backoff=$((attempt * 30))
                echo "::warning::add-mirror failed for ${s9pk} (attempt ${attempt}/${ATTEMPTS}); retrying in ${backoff}s"
                sleep "$backoff"
              done
            fi
          done
        shell: bash
      - name: Publish to Registry via GitHub
        if: ${{ inputs.RELEASE_REGISTRY && !inputs.S3_S9PKS_BASE_URL }}
        run: |
          REGISTRY="${{ inputs.RELEASE_REGISTRY }}"
          TAG="${{ inputs.TAG || github.ref_name }}"
          GH_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}"
          for s9pk in *.s9pk; do
            echo "Publishing ${s9pk} via GitHub release..."
            start-cli --registry "$REGISTRY" registry package add "$s9pk" --url "${GH_URL}/${s9pk}"
          done
        shell: bash
      - name: Upload s9pks
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          retention-days: 14
          compression-level: 0
          name: s9pks
          path: '*.s9pk'
