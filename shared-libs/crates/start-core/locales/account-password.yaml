account.volume-keys-unavailable:
  en_US: 'Protected volume keys are unavailable for this boot. Unlock the data volumes with your password before changing it.'
  de_DE: 'Geschützte Volume-Schlüssel sind für diesen Systemstart nicht verfügbar. Entsperren Sie die Daten-Volumes mit Ihrem Passwort, bevor Sie es ändern.'
  es_ES: 'Las claves protegidas de los volúmenes no están disponibles para este arranque. Desbloquee los volúmenes de datos con su contraseña antes de cambiarla.'
  fr_FR: 'Les clés protégées des volumes ne sont pas disponibles pour ce démarrage. Déverrouillez les volumes de données avec votre mot de passe avant de le modifier.'
  pl_PL: 'Chronione klucze woluminów nie są dostępne podczas tego uruchomienia. Odblokuj woluminy danych hasłem przed jego zmianą.'
