[package]
description = "A JSON `Value` type built on `imbl`"
edition = "2021"
license = "MIT"
name = "imbl-value"
version = "0.5.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
arbitrary = ["proptest", "proptest-derive", "imbl/proptest"]
arena = ["dep:libc", "dep:parking_lot", "dep:talc", "dep:tempfile"]
default = []

[dependencies]
imbl = { version = "7", features = ["serde", "small-chunks"] }
libc = { version = "0.2", optional = true }
parking_lot = { version = "0.12", optional = true }
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
talc = { version = "5.1", optional = true }
tempfile = { version = "3", optional = true }
yasi = { path = "../yasi", features = ["serde"] }
